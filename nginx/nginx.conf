# =============================================================
# Bent Planet — Nginx Reverse Proxy with TLS (Let's Encrypt)
# =============================================================
# Replace "bentplanet.com" with your actual domain throughout.

upstream nextjs {
    server app:3000;
}

# ── HTTP → HTTPS redirect + ACME challenge ───────────────────
server {
    listen 80;
    listen [::]:80;
    server_name bentplanet.com www.bentplanet.com;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS server ─────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bentplanet.com www.bentplanet.com;

    # ── TLS certificates (Let's Encrypt) ─────────────────────
    ssl_certificate     /etc/letsencrypt/live/bentplanet.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bentplanet.com/privkey.pem;

    # ── TLS hardening ────────────────────────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ── Security headers ─────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ── Gzip compression ─────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # ── Proxy to Next.js ─────────────────────────────────────
    location / {
        proxy_pass http://nextjs;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Timeouts for long-running requests (AI generation)
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ── Next.js static assets (aggressive cache) ─────────────
    location /_next/static/ {
        proxy_pass http://nextjs;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── ACME renewal endpoint (always available) ─────────────
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}
