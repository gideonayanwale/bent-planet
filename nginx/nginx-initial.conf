# =============================================================
# Bent Planet — Initial Nginx config (HTTP only)
# =============================================================
# This config is used ONLY for the initial Let's Encrypt
# certificate provisioning. It serves the ACME challenge
# endpoint on port 80 so Certbot can verify domain ownership.
#
# After certificates are obtained, replace this with nginx.conf
# and restart Nginx.

server {
    listen 80;
    listen [::]:80;
    server_name bentplanet.com www.bentplanet.com;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Temporarily proxy to the app on HTTP (no TLS yet)
    location / {
        proxy_pass http://app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
